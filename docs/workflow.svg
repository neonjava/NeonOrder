<svg xmlns="http://www.w3.org/2000/svg" width="960" height="170" viewBox="0 0 960 170" role="img" aria-label="Workflow: Player creates an order, Order is stored in the database, Another player fulfills it, Items and payment are settled"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2860a8"/></marker></defs><rect width="960" height="170" fill="white"/><rect x="20" y="35" width="205" height="100" rx="12" fill="#eef5ff" stroke="#2860a8" stroke-width="2"/><text x="122" y="66" text-anchor="middle" fill="#18324d" font-family="Arial,sans-serif" font-size="15">Player creates an</text><text x="122" y="86" text-anchor="middle" fill="#18324d" font-family="Arial,sans-serif" font-size="15">order</text><path d="M 230 85 h 20" stroke="#2860a8" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="35" width="205" height="100" rx="12" fill="#eef5ff" stroke="#2860a8" stroke-width="2"/><text x="362" y="66" text-anchor="middle" fill="#18324d" font-family="Arial,sans-serif" font-size="15">Order is stored in</text><text x="362" y="86" text-anchor="middle" fill="#18324d" font-family="Arial,sans-serif" font-size="15">the database</text><path d="M 470 85 h 20" stroke="#2860a8" stroke-width="3" marker-end="url(#arrow)"/><rect x="500" y="35" width="205" height="100" rx="12" fill="#eef5ff" stroke="#2860a8" stroke-width="2"/><text x="602" y="66" text-anchor="middle" fill="#18324d" font-family="Arial,sans-serif" font-size="15">Another player</text><text x="602" y="86" text-anchor="middle" fill="#18324d" font-family="Arial,sans-serif" font-size="15">fulfills it</text><path d="M 710 85 h 20" stroke="#2860a8" stroke-width="3" marker-end="url(#arrow)"/><rect x="740" y="35" width="205" height="100" rx="12" fill="#eef5ff" stroke="#2860a8" stroke-width="2"/><text x="842" y="66" text-anchor="middle" fill="#18324d" font-family="Arial,sans-serif" font-size="15">Items and payment are</text><text x="842" y="86" text-anchor="middle" fill="#18324d" font-family="Arial,sans-serif" font-size="15">settled</text></svg>
